name: test

on: [push]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        luaVersion: ["5.1", "5.2", "5.3", "5.4", "5.5", "luajit"]
        exclude:
          # LuaJIT on Windows can't find the Lua library when building C
          # modules with gh-actions-lua, so skip it there.
          - os: windows-latest
            luaVersion: luajit

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@master

    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'

    - uses: luarocks/gh-actions-lua@v14
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - uses: luarocks/gh-actions-luarocks@v7

    - name: setup 
      run: |
        luarocks make rockspecs/carray-scm-0.rockspec

    - name: test
      shell: bash
      run: |
        set -e
        lua -v
        cd tests
        lua test01.lua
        lua test02.lua
        cd ../examples
        lua example01.lua
